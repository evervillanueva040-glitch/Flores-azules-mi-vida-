<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores azules, mi vida</title>
<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#0a1931;
  color:white;
  font-family: sans-serif;
  text-align:center;
}
h1{ font-size:2.2em; margin-bottom:10px; }
p{ font-size:1.2em; opacity:0.9; }
.flowers{ font-size:4em; animation: flotar 2s infinite ease-in-out; }
@keyframes flotar {
  0% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0); }
}
</style>
</head>
<body>
  <div class="flowers">💙🌸💙</div>
  <h1>Flores azules, mi vida</h1>
  <p>Como un río que no pide permiso para avanzar,<br>
  así florece lo que siento por ti.</p>
  <p>🌷💙🌷</p>
</body>
</html>
