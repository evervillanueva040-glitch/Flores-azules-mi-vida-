<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ilary mi vida 💙</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020412;min-height:100vh;overflow:hidden}
.moon{position:fixed;top:12%;right:14%;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#fef9e0,#e6d9a0);box-shadow:0 0 25px 8px rgba(255,255,210,.7),0 0 60px 20px rgba(255,255,200,.25);cursor:pointer;z-index:10}
.title{position:fixed;top:31%;width:100%;text-align:center;z-index:5}
.title h1{font-family:'Dancing Script',cursive;font-size:3.2rem;color:#8ecfff;text-shadow:0 0 12px #1e90ff,0 0 28px #1e90ff}
.title p{color:rgba(255,255,255,.6);margin-top:6px;letter-spacing:2px;font-size:.85rem}
.garden{position:fixed;bottom:0;width:100%;height:52vh;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:0 10px 18px}
.flower-wrap{display:flex;flex-direction:column;align-items:center;animation:up 1.2s ease-out forwards;opacity:0}
@keyframes up{from{transform:translateY(70px);opacity:0}to{transform:translateY(0);opacity:1}}
.stem-line{width:5px;background:linear-gradient(#2d6a4f,#123524);border-radius:3px}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:50;padding:22px}
.card{background:linear-gradient(180deg,#0e1e3a,#070d1e);border:1px solid rgba(126,200,255,.4);border-radius:24px;padding:30px 26px;max-width:340px;width:100%;text-align:center;color:white;box-shadow:0 0 40px rgba(30,144,255,.35)}
.card h2{font-family:'Dancing Script',cursive;color:#8ecfff;font-size:2.2rem;margin-bottom:14px}
</style>
</head>
<body>
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at top,#102040 0%,#020412 60%,#000 100%)"></div>
<div class="moon" onclick="document.getElementById('popup').style.display='flex'"></div>
<div class="title"><h1>Ilary, mi vida 💙</h1><p>TOCA LA LUNA</p></div>
<div class="garden" id="garden"></div>
<div id="popup" onclick="this.style.display='none'"><div class="card" onclick="event.stopPropagation()"><h2>Para ti, Ilary 💙</h2><p>Estas flores azules nunca se marchitan, igual que lo que siento por ti.</p><p style="margin-top:12px"><b>Eres mi vida, mi todo.</b></p><p style="margin-top:16px;font-family:'Dancing Script',cursive;font-size:1.5rem;color:#8ecfff">Te amo infinitamente<br><span style="font-size:.8rem;opacity:.5">- Ever</span></p><button onclick="document.getElementById('popup').style.display='none'" style="margin-top:20px;background:#1e90ff;color:white;border:none;padding:11px 30px;border-radius:30px">Cerrar 💙</button></div></div>
<script>
const garden=document.getElementById('garden');
function flowerSVG(){return `<svg width="68" height="68" viewBox="0 0 68 68"><g transform="translate(34 34)"><ellipse cx="0" cy="-18" rx="11" ry="16" fill="#2e9bff" transform="rotate(0)"/><ellipse cx="0" cy="-18" rx="11" ry="16" fill="#1e7ae0" transform="rotate(72)"/><ellipse cx="0" cy="-18" rx="11" ry="16" fill="#3da9ff" transform="rotate(144)"/><ellipse cx="0" cy="-18" rx="11" ry="16" fill="#1e7ae0" transform="rotate(216)"/><ellipse cx="0" cy="-18" rx="11" ry="16" fill="#2e9bff" transform="rotate(288)"/><circle cx="0" cy="0" r="9" fill="#ffeb3b" stroke="#ff9800" stroke-width="1"/><circle cx="0" cy="0" r="4" fill="#ff9800"/></g></svg>`;}
const heights=[145,165,120,155,135,175,140];
heights.forEach((h,i)=>{let w=document.createElement('div');w.className='flower-wrap';w.style.animationDelay=i*0.15+'s';w.innerHTML=`${flowerSVG()}<div class="stem-line" style="height:${h}px"></div>`;garden.appendChild(w);});
</script>
</body>
</html>
