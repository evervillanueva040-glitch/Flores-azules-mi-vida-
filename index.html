<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores azules, mi vida</title>
<style>
body{margin:0;background:#0a122a;height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;overflow:hidden}
.luna{position:absolute;top:30px;right:30px;width:70px;height:70px;background:#fff9c4;border-radius:50%;box-shadow:0 0 30px #fff9c4,0 0 60px #fff}
h1{color:#7ec8ff;font-family:cursive;font-size:2.5em;text-shadow:0 0 10px #3a8dde;z-index:2;text-align:center;margin:10px}
p{color:white;opacity:0.8;z-index:2;text-align:center}
.jardin{position:relative;width:300px;height:200px}
.flor{position:absolute;bottom:0;animation:flotar 3s infinite ease-in-out}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
</head>
<body>
<div class="luna"></div>
<h1>Flores azules bajo la luna 💙</h1>
<p>Para ti, mi vida<br>cada una es un te amo</p>
<div class="jardin"><div style="font-size:80px;animation:flotar 2s infinite">💙🌸💙🌼💙</div></div>
<p>ILARY</p>
</body>
</html>
