<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti, ILARY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap');
body{background:#000;overflow:hidden;height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:white;font-family:sans-serif}
.moon{position:absolute;top:8%;right:12%;width:110px;height:110px;background:#fffef0;border-radius:50%;box-shadow:0 0 40px #fff;cursor:pointer}
h1{font-family:'Dancing Script',cursive;color:#89d8ff;font-size:2.8rem;text-shadow:0 0 15px #1e90ff}
.flowers{display:flex;gap:10px;height:50vh;align-items:flex-end}
.flower{animation:grow 2s forwards;opacity:0}
@keyframes grow{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(40px)}}
.petal{width:22px;height:22px;background:#1e90ff;border-radius:50% 0 50% 50%;position:absolute}
.center{width:14px;height:14px;background:yellow;border-radius:50%;position:absolute;top:12px;left:12px}
.bloom{width:40px;height:40px;position:relative}
.stem{width:6px;height:120px;background:#1b4332;margin:0 auto}
#msg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:10}
.card{background:#0d1b2a;border:1px solid #1e90ff;padding:25px;border-radius:20px;max-width:320px;text-align:center}
</style>
</head>
<body>
<div class="moon" onclick="document.getElementById('msg').style.display='flex'"></div>
<h1>Ilary, mi vida 💙</h1>
<p style="opacity:.7">Toca la luna</p>
<div class="flowers">
<div class="flower"><div class="bloom"><div class="petal" style="transform:rotate(0deg)"></div><div class="petal" style="transform:rotate(72deg)"></div><div class="petal" style="transform:rotate(144deg)"></div><div class="petal" style="transform:rotate(216deg)"></div><div class="petal" style="transform:rotate(288deg)"></div><div class="center"></div></div><div class="stem"></div></div>
<div class="flower" style="animation-delay:.3s"><div class="bloom"><div class="petal"></div><div class="petal" style="transform:rotate(72deg)"></div><div class="petal" style="transform:rotate(144deg)"></div><div class="petal" style="transform:rotate(216deg)"></div><div class="petal" style="transform:rotate(288deg)"></div><div class="center"></div></div><div class="stem"></div></div>
<div class="flower" style="animation-delay:.6s"><div class="bloom"><div class="petal"></div><div class="petal" style="transform:rotate(72deg)"></div><div class="petal" style="transform:rotate(144deg)"></div><div class="petal" style="transform:rotate(216deg)"></div><div class="petal" style="transform:rotate(288deg)"></div><div class="center"></div></div><div class="stem" style="height:100px"></div></div>
<div class="flower" style="animation-delay:.9s"><div class="bloom"><div class="petal"></div><div class="petal" style="transform:rotate(72deg)"></div><div class="petal" style="transform:rotate(144deg)"></div><div class="petal" style="transform:rotate(216deg)"></div><div class="petal" style="transform:rotate(288deg)"></div><div class="center"></div></div><div class="stem"></div></div>
<div class="flower" style="animation-delay:1.2s"><div class="bloom"><div class="petal"></div><div class="petal" style="transform:rotate(72deg)"></div><div class="petal" style="transform:rotate(144deg)"></div><div class="petal" style="transform:rotate(216deg)"></div><div class="petal" style="transform:rotate(288deg)"></div><div class="center"></div></div><div class="stem" style="height:140px"></div></div>
</div>
<p style="font-size:.7rem;opacity:.5;margin:10px">Flores azules que nunca se marchitan para ti</p>
<div id="msg" onclick="this.style.display='none'"><div class="card" onclick="event.stopPropagation()"><h2 style="font-family:'Dancing Script';color:#89d8ff">Para ti, Ilary 💙</h2><p>Como la luna ilumina la noche, tú iluminas mi vida.</p><p><b>Eres mi vida, mi todo.</b></p><p style="color:#89d8ff;margin-top:10px">Te amo más que a nada - Ever</p><button onclick="document.getElementById('msg').style.display='none'" style="margin-top:15px;background:#1e90ff;border:none;color:white;padding:8px 20px;border-radius:20px">Cerrar 😘</button></div></div>
</body>
                                                                     </html>
